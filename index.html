<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 压缩工具</title>
    <style>
        :root {
            --bg: #f3ead8;
            --panel: #fef9ec;
            --panel-2: #f8f0db;
            --ink: #33302a;
            --ink-2: #71695a;
            --line: #ddd0b4;
            --line-strong: #c9b78f;
            --accent: #b3402f;
            --accent-strong: #97331f;
            --accent-soft: #f7e4dc;
            --ok: #2e7d4f;
            --ok-soft: #e2eee0;
            --warn: #96690a;
            --warn-soft: #f6ead0;
            --err: #b3261e;
            --err-soft: #f8e2de;
            --shadow: 0 1px 2px rgba(101, 80, 40, 0.05), 0 10px 30px rgba(101, 80, 40, 0.07);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #211c16;
                --panel: #2b251d;
                --panel-2: #262019;
                --ink: #ece4d3;
                --ink-2: #b3a78d;
                --line: #483d2e;
                --line-strong: #5f5138;
                --accent: #e07856;
                --accent-strong: #eda183;
                --accent-soft: #3e2a21;
                --ok: #7fb98a;
                --ok-soft: #26352a;
                --warn: #d9a441;
                --warn-soft: #3a3120;
                --err: #e88a80;
                --err-soft: #3d2724;
                --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.35);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }

        .header {
            text-align: center;
            padding: 56px 20px 26px;
        }

        .header h1 {
            font-size: 34px;
            font-weight: 650;
            letter-spacing: -0.02em;
            color: var(--ink);
        }

        .header h1::after {
            content: '';
            display: block;
            width: 44px;
            height: 3px;
            border-radius: 2px;
            background: var(--accent);
            margin: 14px auto 0;
        }

        .header p {
            font-size: 15px;
            color: var(--ink-2);
            margin-top: 12px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            padding: 0 20px 56px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 28px;
            margin-bottom: 18px;
        }

        /* 状态栏 */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--panel-2);
            color: var(--ink-2);
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .status-bar.loading { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
        .status-bar.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
        .status-bar.error { background: var(--err-soft); color: var(--err); border-color: transparent; }

        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            flex-shrink: 0;
            background: var(--ink-2);
        }

        .status-bar.loading .status-dot { background: var(--warn); animation: pulse 1.2s infinite; }
        .status-bar.ok .status-dot { background: var(--ok); }
        .status-bar.error .status-dot { background: var(--err); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* 拖拽上传区 */
        .dropzone {
            border: 1.5px dashed var(--line-strong);
            border-radius: 14px;
            padding: 44px 24px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.25s ease, background 0.25s ease;
            background: var(--panel-2);
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .dropzone-icon {
            width: 54px; height: 54px;
            margin: 0 auto 16px;
            background: var(--accent);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: #fff7ea;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .dropzone h3 {
            font-size: 17px; font-weight: 600; color: var(--ink);
        }

        .dropzone p {
            font-size: 14px; color: var(--ink-2); margin-top: 6px;
        }

        .dropzone input { display: none; }

        /* 文件列表 */
        .file-list {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            background: var(--panel-2);
            border: 1px solid var(--line);
            font-size: 14px;
        }

        .file-item-icon {
            width: 36px; height: 36px;
            background: var(--accent-soft);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: var(--accent-strong); font-weight: 700; font-size: 12px;
            flex-shrink: 0;
        }

        .file-item-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
            color: var(--ink);
        }

        .file-item-size {
            color: var(--ink-2);
            font-size: 13px;
            flex-shrink: 0;
        }

        .file-item-status {
            color: var(--accent-strong);
            font-size: 13px;
            flex-shrink: 0;
        }

        .file-item-remove {
            background: none; border: none;
            color: var(--ink-2); cursor: pointer;
            font-size: 18px; padding: 0 4px;
            transition: color 0.2s;
        }

        .file-item-remove:hover { color: var(--err); }

        /* 压缩选项 */
        .quality-options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
        }

        .quality-option {
            flex: 1 1 120px;
            position: relative;
            padding: 16px 12px;
            border-radius: 12px;
            border: 1.5px solid var(--line);
            text-align: center;
            cursor: pointer;
            transition: border-color 0.25s, background 0.25s;
            background: var(--panel);
            color: var(--ink-2);
        }

        .quality-option:hover {
            border-color: var(--line-strong);
        }

        .quality-option.active {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .quality-option.active::after {
            content: '';
            position: absolute;
            top: 10px; right: 10px;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--accent);
        }

        .quality-option h4 {
            font-size: 15px; font-weight: 600; color: var(--ink);
        }

        .quality-option p {
            font-size: 12px; color: var(--ink-2); margin-top: 4px;
        }

        /* 压缩按钮 */
        .btn-compress {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #fff7ea;
            background: var(--accent);
            cursor: pointer;
            transition: background 0.25s, transform 0.15s;
            letter-spacing: 0.02em;
        }

        .btn-compress:hover {
            background: var(--accent-strong);
            transform: translateY(-1px);
        }

        .btn-compress:active { transform: translateY(0); }

        .btn-compress:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        /* 进度区域 */
        .progress-section {
            margin-top: 20px;
            display: none;
        }

        .progress-section.show { display: block; }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .progress-header span:first-child { color: var(--ink); font-weight: 500; }
        .progress-header span:last-child { color: var(--ink-2); }

        .progress-bar {
            height: 6px;
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .progress-status {
            margin-top: 8px;
            font-size: 13px;
            color: var(--ink-2);
        }

        /* 结果列表 */
        .results-section {
            display: none;
        }

        .results-section.show { display: block; }

        .results-title {
            font-size: 18px;
            font-weight: 650;
            margin-bottom: 16px;
            color: var(--ink);
        }

        .result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border-radius: 12px;
            background: var(--panel-2);
            border: 1px solid var(--line);
            margin-bottom: 8px;
        }

        .result-item-icon {
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 17px; flex-shrink: 0;
        }

        .result-item-icon.success { background: var(--ok-soft); color: var(--ok); }
        .result-item-icon.fail { background: var(--err-soft); color: var(--err); }

        .result-item-info { flex: 1; }

        .result-item-name {
            font-weight: 600; font-size: 15px;
            color: var(--ink);
        }

        .result-item-detail {
            font-size: 13px; color: var(--ink-2); margin-top: 4px;
        }

        .result-item-ratio {
            font-size: 18px; font-weight: 700;
            color: var(--ok); flex-shrink: 0;
        }

        .result-item-ratio.negative { color: var(--warn); }

        .result-error {
            color: var(--err);
            font-size: 13px;
            margin-top: 2px;
        }

        .btn-download {
            padding: 9px 18px;
            border: 1.5px solid var(--accent);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-strong);
            background: transparent;
            cursor: pointer;
            transition: background 0.25s;
            margin-top: 8px;
        }

        .btn-download:hover {
            background: var(--accent-soft);
        }

        .results-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--ink-2);
        }

        /* Toast 通知 */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            z-index: 999;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: var(--shadow);
            background: var(--ink);
            color: var(--panel);
        }

        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--err); color: #fff; }
        .toast.success { background: var(--ok); color: #fff; }

        /* 个人信息卡片 */
        .profile-card {
            padding: 22px 24px !important;
        }

        .profile-content {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .profile-avatar {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--line);
        }

        .profile-info { flex: 1; }

        .profile-name {
            font-size: 17px;
            font-weight: 650;
            color: var(--ink);
            margin-bottom: 2px;
        }

        .profile-bio {
            font-size: 14px;
            color: var(--ink-2);
            margin-bottom: 10px;
        }

        .profile-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .profile-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 13px;
            background: var(--panel-2);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--ink-2);
            text-decoration: none;
            transition: all 0.2s;
            border: 1px solid var(--line);
        }

        .profile-link:hover {
            border-color: var(--line-strong);
            color: var(--ink);
            transform: translateY(-1px);
        }

        .profile-link svg {
            width: 16px;
            height: 16px;
        }

        .mode-note {
            margin-top: 12px;
            font-size: 13px;
            color: var(--ink-2);
            text-align: center;
        }

        @media (max-width: 600px) {
            .header { padding-top: 40px; }
            .header h1 { font-size: 27px; }
            .card { padding: 20px; }
            .quality-option { flex: 1 1 42%; }
        }

        @media (max-width: 500px) {
            .profile-content {
                flex-direction: column;
                text-align: center;
            }

            .profile-links {
                justify-content: center;
            }
        }

    </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="header">
    <h1>PDF 压缩工具</h1>
    <p>浏览器端处理，保护隐私 · 部署在 Vercel</p>
</div>

<div class="container">

    <!-- 状态栏 -->
    <div class="card" style="padding: 16px 24px;">
        <div class="status-bar ok" id="statusBar">
            <div class="status-dot"></div>
            <span id="statusText">就绪 · 纯浏览器处理，无需服务器</span>
        </div>
    </div>

    <!-- 上传区域 -->
    <div class="card">
        <div class="dropzone" id="dropzone">
            <div class="dropzone-icon">PDF</div>
            <h3>拖拽 PDF 文件到此处</h3>
            <p>或点击此处选择文件 · 支持批量上传</p>
            <input type="file" id="fileInput" multiple accept=".pdf">
        </div>

        <div class="file-list" id="fileList"></div>

        <!-- 压缩选项 -->
        <div class="quality-options">
            <div class="quality-option" data-quality="light" onclick="selectQuality(this)">
                <h4>轻度压缩</h4>
                <p>保留文字 · 图片高质量</p>
            </div>
            <div class="quality-option active" data-quality="standard" onclick="selectQuality(this)">
                <h4>标准压缩</h4>
                <p>保留文字 · 平衡推荐</p>
            </div>
            <div class="quality-option" data-quality="extreme" onclick="selectQuality(this)">
                <h4>强力压缩</h4>
                <p>保留文字 · 图片更小</p>
            </div>
            <div class="quality-option" data-quality="raster" onclick="selectQuality(this)">
                <h4>整页图片化</h4>
                <p>仅适合扫描件 · 文字不可选</p>
            </div>
        </div>
        <p class="mode-note">
            前三档只重压缩文档里的图片，文字、矢量、链接与表单保持不变；扫描件可选「整页图片化」。
        </p>

        <!-- 压缩按钮 -->
        <button class="btn-compress" id="btnCompress" onclick="startCompress()" disabled>
            开始压缩
        </button>

        <!-- 进度条 -->
        <div class="progress-section" id="progressSection">
            <div class="progress-header">
                <span id="progressLabel">正在压缩...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-status" id="progressStatus">准备中...</div>
        </div>
    </div>

    <!-- 结果区域 -->
    <div class="results-section" id="resultsSection">
        <div class="card">
            <div class="results-title" id="resultsTitle">压缩完成</div>
            <div id="resultsList"></div>
            <div class="results-footer" id="resultsFooter"></div>
        </div>
    </div>

    <!-- 个人信息 -->
    <div class="card profile-card">
        <div class="profile-content">
            <img src="assets/avatar.png" alt="Avatar" class="profile-avatar">
            <div class="profile-info">
                <h3 class="profile-name">阿牛</h3>
                <p class="profile-bio">持续学习，不断精进</p>
                <div class="profile-links">
                    <a href="https://github.com/bobbyreader" target="_blank" class="profile-link">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                        GitHub
                    </a>
                    <a href="#" class="profile-link license-link">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm-1.25 17.292l-4.5-4.364 1.857-1.858 2.643 2.506 5.643-5.784 1.857 1.857-7.5 7.643z"/></svg>
                        Free Forever
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
